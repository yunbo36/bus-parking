<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バス駐車場受付管理</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fa;color:#17253b;margin:0}main{max-width:1000px;margin:auto;padding:18px}h1{font-size:23px}section{background:white;border-radius:12px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}button,input,select{font:inherit;padding:10px;border:1px solid #bbc5d3;border-radius:8px;margin:3px}button{background:#173c70;color:white;cursor:pointer}button.secondary{background:#e5ebf3;color:#17253b}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats b{background:#e7f0fb;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:680px}td,th{padding:9px;border-bottom:1px solid #dde4ed;text-align:left}th{background:#f0f4fa}.scroll{overflow:auto}label{display:inline-block;margin:4px}label input,label select{display:block}small{color:#596879}.warn{color:#9c3b17}</style></head><body><main><h1>バス駐車場 受付管理</h1><small>端末ごとに保存・LINEでJSONを交換／公開ページには個人データを含めません</small><section><label>対象日<input id="day" type="date" value="2026-10-11"></label><label>検索<input id="search" placeholder="会社・担当者・部屋・バスID"></label><label>駐車場<select id="filter"><option value="">すべて</option><option>当駐車場</option><option>別駐車場</option><option>未定</option></select></label><div class="stats" id="stats"></div></section><section><h2>受付登録・編集</h2><form id="form"><input type="hidden" id="edit"><label>日付<input required id="date" type="date"></label><label>部屋番号<input required id="room"></label><label>旅行会社<input id="company"></label><label>担当者<input id="person"></label><label>駐車場<select id="location"><option>未定</option><option>当駐車場</option><option>別駐車場</option></select></label><label>バスID<input id="busId" placeholder="当駐車場のみ"></label><label>状態<select id="status"><option>未受付</option><option>受付済</option><option>要確認</option></select></label><label>備考<input id="note"></label><div><button type="submit">保存</button><button type="button" class="secondary" id="reset">新規入力</button></div></form></section><section><h2>受付一覧</h2><div class="scroll"><table><thead><tr><th>部屋</th><th>旅行会社・担当者</th><th>駐車場</th><th>バスID</th><th>状態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2>データ交換・報告書</h2><button id="export">JSONバックアップ・LINE送信用</button><label>JSON取込・統合<input id="import" type="file" accept=".json,application/json"></label><button id="csv" class="secondary">表示日のCSV出力</button><p class="warn">※このブラウザの保存領域を消去するとデータも消えます。毎日JSONバックアップを保存してください。以前のHTML版からはJSONをエクスポートして取り込んでください。</p></section></main><script>
const $=id=>document.getElementById(id),key='bus-parking-v1';let records=[];try{records=JSON.parse(localStorage.getItem(key))||[]}catch(e){};if(!Array.isArray(records))records=[];
const fields=['date','room','company','person','location','busId','status','note'];const save=()=>localStorage.setItem(key,JSON.stringify(records));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function reset(){ $('form').reset();$('edit').value='';$('date').value=$('day').value;sync()}function sync(){if($('location').value!=='当駐車場'){$('busId').value='';$('busId').disabled=true}else $('busId').disabled=false}
function render(){const d=$('day').value,q=$('search').value.toLowerCase(),f=$('filter').value;const daily=records.filter(r=>r.date===d);$('stats').innerHTML=['予定 '+daily.length,'当駐車場 '+daily.filter(r=>r.location==='当駐車場').length,'別駐車場 '+daily.filter(r=>r.location==='別駐車場').length,'未受付 '+daily.filter(r=>r.status==='未受付').length].map(s=>'<b>'+s+'</b>').join('');$('rows').innerHTML=daily.filter(r=>(!f||r.location===f)&&[r.room,r.company,r.person,r.busId].join(' ').toLowerCase().includes(q)).sort((a,b)=>String(a.room).localeCompare(String(b.room),'ja',{numeric:true})).map(r=>'<tr><td>'+esc(r.room)+'</td><td>'+esc(r.company)+'<br><small>'+esc(r.person)+'</small></td><td>'+esc(r.location)+'</td><td>'+esc(r.busId)+'</td><td>'+esc(r.status)+'</td><td><button class="secondary" data-edit="'+esc(r.id)+'">編集</button><button class="secondary" data-delete="'+esc(r.id)+'">削除</button></td></tr>').join('')||'<tr><td colspan="6">該当するデータはありません</td></tr>'}
$('form').onsubmit=e=>{e.preventDefault();const r={id:$('edit').value||'r'+Date.now()+Math.random().toString(36).slice(2)};for(const f of fields)r[f]=$(f).value;if(r.location!=='当駐車場')r.busId='';const i=records.findIndex(x=>x.id===r.id);if(i<0)records.push(r);else records[i]=r;save();render();reset()};
$('rows').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.delete,r=records.find(x=>x.id===id);if(!r)return;if(b.dataset.delete){if(confirm('この記録を削除しますか？')){records=records.filter(x=>x.id!==id);save();render()}}else{$('edit').value=r.id;for(const f of fields)$(f).value=r[f]||'';sync();$('form').scrollIntoView({behavior:'smooth'})}};
function download(s,n,t){const u=URL.createObjectURL(new Blob([s],{type:t})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
$('export').onclick=()=>download(JSON.stringify({app:'bus-parking-v1',records,exportedAt:new Date().toISOString()},null,2),'bus-parking-'+new Date().toISOString().slice(0,10)+'.json','application/json');
$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const j=JSON.parse(await file.text());if(!Array.isArray(j.records))throw Error('JSON形式が異なります');let add=0,change=0;for(const r of j.records){if(!r||!r.date||!r.room||!['当駐車場','別駐車場','未定'].includes(r.location))continue;const i=records.findIndex(x=>x.date===r.date&&String(x.room)===String(r.room));if(i<0){records.push({...r,id:records.some(x=>x.id===r.id)?'import-'+Date.now()+'-'+add:r.id||'import-'+Date.now()+'-'+add});add++}else if(JSON.stringify(fields.map(f=>records[i][f]||''))!==JSON.stringify(fields.map(f=>r[f]||''))){if(confirm(r.date+' 部屋'+r.room+'の内容が異なります。受信データで上書きしますか？')){records[i]={...r,id:records[i].id};change++}}}save();render();alert('追加 '+add+'件、更新 '+change+'件')}catch(err){alert('取込エラー: '+err.message)}e.target.value=''};
$('csv').onclick=()=>{const cols=['date','room','company','person','busId','location','status','note'];const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const lines=[cols.join(','),...records.filter(r=>r.date===$('day').value).map(r=>cols.map(c=>quote(r[c])).join(','))];download('\ufeff'+lines.join('\r\n'),'parking-'+$('day').value+'.csv','text/csv;charset=utf-8')};
$('reset').onclick=reset;$('location').onchange=sync;for(const id of ['day','search','filter'])$(id).addEventListener('input',()=>{if(id==='day'&&!$('edit').value)$('date').value=$('day').value;render()});reset();render();
</script></body></html>
